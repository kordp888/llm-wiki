<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Factuality quality assurance gate</title>
  <desc id="desc">Content moves from collection through script generation, a fail-closed factuality gate, rendering and text to speech, then upload. The gate is backed by verified test and upload counts.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#071E3D" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6B7480"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 4px; fill: #A66206; }
      .headline { font-size: 58px; font-weight: 760; fill: #071E3D; letter-spacing: -1.5px; }
      .subhead { font-size: 24px; font-weight: 450; fill: #6B7480; }
      .node-title { font-size: 24px; font-weight: 700; fill: #16202B; }
      .node-copy { font-size: 18px; font-weight: 450; fill: #6B7480; }
      .node-title-inverse { font-size: 25px; font-weight: 750; fill: #FFFFFF; }
      .node-copy-inverse { font-size: 18px; font-weight: 500; fill: #FFFFFF; opacity: 0.82; }
      .pill { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
      .metric { font-size: 42px; font-weight: 800; fill: #0B2E5C; letter-spacing: -1px; }
      .metric-label { font-size: 17px; font-weight: 600; fill: #6B7480; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="64" y="54" width="1472" height="792" rx="36" fill="#FFFFFF" stroke="#DFE3E8" stroke-width="2"/>

  <text x="118" y="125" class="sans eyebrow">CONTENT PIPELINE</text>
  <text x="118" y="192" class="sans headline">Truth before throughput</text>
  <text x="118" y="232" class="sans subhead">A factuality gate decides whether content may reach production.</text>

  <line x1="356" y1="411" x2="402" y2="411" stroke="#6B7480" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="638" y1="411" x2="684" y2="411" stroke="#6B7480" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="920" y1="411" x2="966" y2="411" stroke="#6B7480" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1202" y1="411" x2="1248" y2="411" stroke="#6B7480" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="118" y="328" width="238" height="166" rx="24" fill="#EEF2F7"/>
    <text x="146" y="389" class="sans node-title">Collect</text>
    <text x="146" y="426" class="sans node-copy">Gather source material</text>
    <text x="146" y="454" class="sans node-copy">with provenance intact</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="400" y="328" width="238" height="166" rx="24" fill="#EEF2F7"/>
    <text x="428" y="389" class="sans node-title">Generate script</text>
    <text x="428" y="426" class="sans node-copy">Create a structured</text>
    <text x="428" y="454" class="sans node-copy">production draft</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="682" y="310" width="238" height="202" rx="24" fill="#071E3D"/>
    <text x="710" y="381" class="sans node-title-inverse">Factuality gate</text>
    <text x="710" y="420" class="sans node-copy-inverse">Evidence must pass</text>
    <text x="710" y="449" class="sans node-copy-inverse">before production</text>
    <rect x="710" y="469" width="134" height="30" rx="15" fill="#E08A12"/>
    <text x="777" y="490" text-anchor="middle" class="sans pill" fill="#071E3D">FAIL-CLOSED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="964" y="328" width="238" height="166" rx="24" fill="#EEF2F7"/>
    <text x="992" y="389" class="sans node-title">Render + TTS</text>
    <text x="992" y="426" class="sans node-copy">Produce final media</text>
    <rect x="992" y="451" width="116" height="28" rx="14" fill="#DFE3E8"/>
    <text x="1050" y="471" text-anchor="middle" class="sans pill" fill="#0A7D77">FAIL-OPEN</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1246" y="328" width="238" height="166" rx="24" fill="#EEF2F7"/>
    <text x="1274" y="389" class="sans node-title">Upload</text>
    <text x="1274" y="426" class="sans node-copy">Release only gated</text>
    <text x="1274" y="454" class="sans node-copy">production output</text>
  </g>

  <path d="M801 512 L801 568" fill="none" stroke="#0B2E5C" stroke-width="3"/>
  <rect x="620" y="568" width="362" height="64" rx="18" fill="#EEF2F7" stroke="#DFE3E8" stroke-width="2"/>
  <text x="801" y="607" text-anchor="middle" class="sans node-copy" fill="#16202B">A blocked check stops the full pipeline.</text>

  <line x1="118" y1="683" x2="1484" y2="683" stroke="#DFE3E8" stroke-width="2"/>

  <g>
    <text x="118" y="750" class="sans metric">683</text>
    <text x="118" y="785" class="sans metric-label">pipeline tests</text>
  </g>
  <line x1="446" y1="721" x2="446" y2="799" stroke="#DFE3E8" stroke-width="2"/>
  <g>
    <text x="510" y="750" class="sans metric">614 / 0</text>
    <text x="510" y="785" class="sans metric-label">banned-expression cases / false positives</text>
  </g>
  <line x1="1052" y1="721" x2="1052" y2="799" stroke="#DFE3E8" stroke-width="2"/>
  <g>
    <text x="1116" y="750" class="sans metric" fill="#0A7D77">319</text>
    <text x="1116" y="785" class="sans metric-label">gated uploads</text>
  </g>
</svg>
